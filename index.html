<!DOCTYPE html>
<html>
<head>
    <title>Online Exam Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Online Examination Portal</h1>
    <p>Welcome to the Online Examination System</p>

    <h2>General Knowledge Test</h2>

    <p>What is the capital of India?</p>

    <label>
        <input type="radio" name="answer" value="Mumbai">
        Mumbai
    </label>

    <label>
        <input type="radio" name="answer" value="New Delhi">
        New Delhi
    </label>

    <label>
        <input type="radio" name="answer" value="Hyderabad">
        Hyderabad
    </label>

    <label>
        <input type="radio" name="answer" value="Chennai">
        Chennai
    </label>

    <br><br>

    <button onclick="submitAnswer()">Submit Answer</button>

    <p id="result"></p>

    <h2>Student Login</h2>

    <div class="login-card">
        <input type="text" id="username" placeholder="Enter username">
        <br><br>

        <input type="password" id="password" placeholder="Enter password">
        <br><br>

        <button onclick="login()">Login</button>

        <p id="loginMessage"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
