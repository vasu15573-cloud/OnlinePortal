<!DOCTYPE html>
<html>
<head>
    <title>Online Exam Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Online Examination System</h1>

    <p>Welcome to the Online Examination System</p>

<h2>General Knowledge Exam</h2>
    <p>What is the capital of India?</p>

    <label>
        <input type="radio" name="answer" value="Mumbai">
        Mumbai
    </label>

    <label>
        <input type="radio" name="answer" value="New Delhi">
        New Delhi
    </label>

    <label>
        <input type="radio" name="answer" value="Hyderabad">
        Hyderabad
    </label>

    <label>
        <input type="radio" name="answer" value="Chennai">
        Chennai
    </label>

    <br><br>

    <button onclick="submitAnswer()">Submit Answer</button>

    <p id="result"></p>

    <h2>Student Login</h2>

    <div class="login-card">
    <h2>Student Login</h2>

    <p>Enter your details to access the Online Examination System.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter your username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password">

    <button onclick="login()">Login to Exam</button>

    <p id="loginMessage"></p>
</div>

    <script src="script.js"></script>

</body>
</html>
